<title>Job Radar Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: an operator's desk. Top bar with the product and five views; Today is a work queue (one role in focus, the line behind it) beside a narrow rail that keeps score (goal, streak, follow-ups, runs). Other views are dense lists that open one side panel where every field saves as you leave it. One blue marks only data and the one action. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --raise:#f8f9fb;
  --line:#e2e5ec; --line-strong:#c8cdd8;
  --fg:#131821; --ink2:#2c3340; --muted:#596173; --faint:#656c7b;
  --accent:#2a5aa8; --accent-ink:#ffffff; --accent-soft:#e2eaf7; --accent-mid:#9db6e0;
  --good:#1c7442; --good-soft:#e0f2e7; --warn:#995800; --warn-soft:#fbefd8; --bad:#b03636; --bad-soft:#f8e3e3;
  --fit-top:#1c7442; --fit-hi:#2a5aa8; --fit-mid:#9a5a00; --fit-lo:#656c7b; --streak:#c2410c;
  --scrim:rgba(14,20,32,.32); --shadow:0 12px 40px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.06);
  --f:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px; --rc:8px;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#151a21; --sunk:#11151b; --raise:#1a2029;
  --line:#232a34; --line-strong:#344050;
  --fg:#e7eaf0; --ink2:#c9cfd9; --muted:#a0a8b6; --faint:#8a93a2;
  --accent:#8eb0ef; --accent-ink:#0b1730; --accent-soft:#1b2944; --accent-mid:#3f5f99;
  --good:#7ed39b; --good-soft:#15301f; --warn:#e7b25d; --warn-soft:#352812; --bad:#f19494; --bad-soft:#3a1c1c;
  --fit-top:#7ed39b; --fit-hi:#8eb0ef; --fit-mid:#e7b25d; --fit-lo:#8a93a2; --streak:#fb923c;
  --scrim:rgba(0,0,0,.5); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#151a21; --sunk:#11151b; --raise:#1a2029;
  --line:#232a34; --line-strong:#344050;
  --fg:#e7eaf0; --ink2:#c9cfd9; --muted:#a0a8b6; --faint:#8a93a2;
  --accent:#8eb0ef; --accent-ink:#0b1730; --accent-soft:#1b2944; --accent-mid:#3f5f99;
  --good:#7ed39b; --good-soft:#15301f; --warn:#e7b25d; --warn-soft:#352812; --bad:#f19494; --bad-soft:#3a1c1c;
  --fit-top:#7ed39b; --fit-hi:#8eb0ef; --fit-mid:#e7b25d; --fit-lo:#8a93a2; --streak:#fb923c;
  --scrim:rgba(0,0,0,.5); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--accent-soft);color:var(--fg)}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)}
kbd{font:500 .72rem var(--f);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:relative;flex:none;z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;height:56px;display:flex;align-items:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;color:var(--fg);text-decoration:none}
.brand svg{color:var(--accent)}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:500;text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--sunk);font-weight:600}
.nav .n{font-size:.78rem;color:var(--faint)}
.top .btn{flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--rc);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform 140ms var(--ease),background-color 140ms,border-color 140ms}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{border-color:var(--fg)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.08);border-color:var(--accent)}}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
@media (hover:hover){.btn.ghost:hover{color:var(--fg);background:var(--sunk);border-color:transparent}}
.btn.sm{height:30px;padding:0 10px;font-size:.84rem}
.btn.lg{height:44px;padding:0 20px;font-size:.98rem}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
@media (hover:hover){.btn.danger:hover{background:var(--bad-soft);border-color:transparent}}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.iconbtn{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--muted);cursor:pointer}
@media (hover:hover){.iconbtn:hover{background:var(--sunk);color:var(--fg)}}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit}
@media (hover:hover){.link:hover{text-decoration:underline;text-underline-offset:3px}}

/* ---------- page ---------- */
.page{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:1320px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.titlerow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
h1 .date{color:var(--faint);font-weight:500;margin-left:8px;font-size:1.05rem;letter-spacing:0}
.finding{margin:6px 0 0;color:var(--muted);font-size:.98rem;max-width:70ch;text-wrap:pretty}
.finding b{color:var(--fg);font-weight:600}
h2{font-size:1rem;font-weight:600;margin:0;letter-spacing:-.005em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 0}
.phead .muted{font-size:.84rem}
.pbody{padding:12px 18px 16px}

/* ---------- paste bar ---------- */
.paste{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:20px;transition:border-color 140ms}
.paste:focus-within{border-color:var(--accent)}
.paste .ic{display:grid;place-items:center;width:38px;color:var(--faint)}
.paste input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1rem;padding:0 4px}
.paste input::placeholder{color:var(--faint)}

/* ---------- today grid ---------- */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
.today-main{display:grid;gap:20px;min-width:0}
.rail{display:grid;gap:16px;min-width:0;overflow-x:hidden}
.rail>.panel{min-width:0}
@media (max-width:980px){.today{grid-template-columns:1fr}.rail{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}

/* focus card */
.focus{padding:22px 24px 20px;display:grid;gap:14px}
.focus-top{display:flex;align-items:flex-start;gap:16px}
.focus-top .grow{flex:1;min-width:0}
.focus .ftitle{font-size:1.38rem;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin:4px 0 4px;text-wrap:balance}
.focus .ftitle a{color:var(--fg);text-decoration:none}
@media (hover:hover){.focus .ftitle a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px}}
.byline{color:var(--muted);font-size:.93rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.byline a{color:var(--ink2);font-weight:600;text-decoration:none}
@media (hover:hover){.byline a:hover{color:var(--accent)}}
.score{flex:none;text-align:right}
.score .num{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .num.hi{color:var(--accent)}
.score .lbl{font-size:.78rem;color:var(--muted);margin-top:4px;white-space:nowrap}
.why{color:var(--ink2);font-size:.94rem;line-height:1.55;max-width:75ch;margin:0}
.why.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:4px}
.actions .sp{flex:1}
.focus.leaving{opacity:0;transform:translateX(-12px);transition:opacity 180ms var(--ease),transform 180ms var(--ease)}
.focus.entering{animation:enter 260ms var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.focus.leaving{transform:none}.focus.entering{animation:fade 160ms ease}@keyframes fade{from{opacity:0}}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;flex:none;background:var(--sunk);color:var(--muted)}
.chip.home{background:var(--accent-soft);color:var(--accent)}
.chip.remote{background:var(--sunk);color:var(--ink2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.out{background:none;border:1px dashed var(--line-strong);color:var(--faint)}

/* queue rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background-color 120ms}
.row:first-child{border-top:0}
@media (hover:hover){.row:hover{background:var(--raise)}}
.row .fitn{font-weight:700;font-size:1.02rem;text-align:center}
.row .fitn.hi{color:var(--accent)} .row .fitn.lo{color:var(--faint)}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:.86rem;display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.row .s .co{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28ch}
.row .r{display:flex;gap:6px;align-items:center}
.more{padding:10px 18px 14px;border-top:1px solid var(--line);font-size:.88rem}

/* goal rail */
.goal{padding:16px;min-width:0}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pips{display:flex;gap:6px;margin:12px 0 10px;min-width:0}
.pip{flex:1 1 0;min-width:0;height:26px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;color:transparent;transition:background-color 200ms var(--ease),border-color 200ms}
.pip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pip.pop{animation:pop 380ms var(--ease)}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.pip.pop svg,.pip svg{width:13px;height:13px}
.pip.extra{flex:0 0 auto;padding:0 8px;background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.pip.pop{animation:none}}
.goal-line{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted)}
.goal-line b{color:var(--fg);font-weight:600}
.big{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.done-msg{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.9rem}
.streak{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.heat{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.heat .c{height:12px;min-width:0;border-radius:3px;background:var(--sunk);position:relative}
.heat .c.l1{background:color-mix(in srgb,var(--accent) 25%,var(--sunk))}
.heat .c.l2{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.heat .c.l3{background:var(--accent)}
.heat .c.today{box-shadow:inset 0 0 0 2px var(--fg)}
.heat-lbl{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;font-size:.7rem;color:var(--faint);text-align:center}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;font-size:.9rem}
.kv + .kv{border-top:1px solid var(--line)}
.kv .v{font-weight:600}
.mini{display:grid;gap:2px}
.fu{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.fu:first-child{border-top:0;padding-top:2px}
.fu .t{font-weight:600;font-size:.92rem}
.fu .s{font-size:.84rem;color:var(--muted)}
.fu .r{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.run{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.run:first-child{border-top:0;padding-top:2px}
.run .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.run .t{font-weight:600;font-size:.92rem}
.run .s{font-size:.84rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good)} .dot.err{background:var(--bad)}

/* ---------- lists ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.tabs .n{color:var(--faint);margin-left:6px;font-size:.82rem}
.search{flex:1 1 220px;position:relative;max-width:360px}
.search input{width:100%;height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--rc);padding:0 10px 0 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--rc);padding:3px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 11px;border-radius:6px;font-size:.86rem;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sel{height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--rc);padding:0 8px;font-size:.88rem}
.count{font-size:.86rem;color:var(--muted);margin-left:auto}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:52px minmax(0,1.6fr) minmax(0,1fr) 150px 36px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background-color 120ms}
.li:first-child{border-top:0}
@media (hover:hover){.li:hover{background:var(--raise)}}
.li.dim{opacity:.6}
.li .fitn{font-weight:700;font-size:1.05rem;text-align:center}
.li .fitn.hi{color:var(--accent)} .li .fitn.lo{color:var(--faint)}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .w{min-width:0;display:grid;gap:4px;justify-items:start}
.li .w .s{max-width:100%}
.li .st{justify-self:start}
.li.co{grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 150px 120px}
.li.src{grid-template-columns:110px minmax(0,1.6fr) minmax(0,1fr) 70px 80px}
.tier{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:6px;background:var(--sunk);color:var(--ink2);font-weight:700;font-size:.78rem}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.applied::before{background:var(--accent)} .status.interview::before,.status.offer::before{background:var(--good)}
.status.rejected::before,.status.closed::before,.status.skipped::before,.status.no-fit::before{background:var(--line-strong)}
.status.hot::before{background:var(--warn)} .status.later::before{background:var(--accent-mid)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:6px}
.empty .btn{margin-top:14px}
@media (max-width:820px){
  .li,.li.co,.li.src{grid-template-columns:44px minmax(0,1fr) auto;row-gap:6px}
  .li .w{grid-column:2/4}
  .li .hide-sm{display:none}
}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem}
.toggle{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background-color 160ms}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 180ms var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(14px)}

/* ---------- side panel ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade 160ms ease}
@keyframes fade{from{opacity:0}}
.side{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide 240ms var(--ease)}
@keyframes slide{from{transform:translateX(32px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.side{animation:fade 160ms ease}}
.side-h{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.side-h .grow{flex:1;min-width:0}
.side-h h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.side-h .s{color:var(--muted);font-size:.9rem;margin-top:3px}
.side-b{flex:1;overflow-y:auto;padding:18px 20px 28px;display:grid;gap:22px;align-content:start}
.side-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side-f .sp{flex:1}
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h3{font-size:.92rem;font-weight:600;margin:0}
.stpick{display:flex;flex-wrap:wrap;gap:6px}
.stpick button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:.86rem;font-weight:500;color:var(--ink2);cursor:pointer;transition:transform 120ms var(--ease)}
.stpick button:active{transform:scale(.96)}

<script>
/* =================== constants =================== */
const BOARD_FIELDS_JOB=["role","companyId","company","tier","url","city","mode","scope","modeNote","contract","posted","deadline","cv","fit","flags","status","note","appliedAt","interviewAt","salary"];
const REVIEW=["new","near-miss","older","unlisted?","later"];
const JOB_ST=[["new","To review"],["applied","Applied"],["interview","Interviewing"],["offer","Offer"],["rejected","Rejected"],["closed","Closed"],["skipped","Not for me"]];
const JOB_ST_ALL=Object.fromEntries([...JOB_ST,["near-miss","Near miss"],["older","Older posting"],["unlisted?","Check it's open"],["later","Later"]]);
const CO_ST=[["watch","Watching"],["hot","Priority"],["applied","Applied"],["contacted","Contacted"],["no-fit","Not a fit"]];
const TIERS=[["A","Home-city product"],["B","Home-city agency or studio"],["C","Same country, remote"],["D","EU remote, hires in your country"],["R","Europe, with relocation"],["S","Niche sector"],["P","Public research and calls"],["E","Big tech"],["X","Consultancy or staffing"]];
const MODES=[["on-site","On-site"],["hybrid","Hybrid"],["remote","Remote"]];
const DEF_CVS=[["MAIN","Main CV","the candidate's main CV"]];
let CVS=DEF_CVS;
function setCvs(list){CVS=Array.isArray(list)&&list.length?list.filter(c=>c&&c.key).map(c=>[String(c.key).toUpperCase(),c.label||c.key,c.focus||c.label||c.key]):DEF_CVS}
const cvEnum=()=>CVS.map(([k])=>`"${k}"`).join("|");
const cvScoreShape=()=>"{"+CVS.map(([k])=>`"${k}": integer`).join(", ")+"}";
const cvFocusText=()=>CVS.map(([k,l,f])=>`${k} (${f})`).join(", ");
const SRC_ST=[["works","Works"],["partial","Partly works"],["untested","Not tried yet"],["blocked","Blocked"]];
const SRC_KINDS=["Job board","Aggregator","Remote board","Startup board","Design board","Staffing agency","Public calls","ATS","Company directory"];
const DEF_SET={homeCity:"",country:"",nearby:[],modes:["on-site","hybrid","remote"],remoteFrom:"Europe",relocate:"home",otherCities:[],language:"English",timezone:"",maxYears:null,cvs:[]};
const DEF_GOAL={dailyTarget:5,weekdaysOnly:true};
const NON_EU=/\b(usa|u\.s\.|united states|new york|san francisco|california|texas|seattle|boston|chicago|canada|toronto|vancouver|india|bangalore|bengaluru|singapore|australia|sydney|brazil|mexico|china|japan|tokyo|dubai|uae|israel|tel aviv|hong kong|korea|philippines|argentina)\b/;
const RC="Claude Code Remote";

/* =================== state =================== */
let db=null, user=null, sample=null, mcp=null, perms=null;
let jobs=[], cos=[], srcs=[], lastRun=null, settings={...DEF_SET}, goals={...DEF_GOAL}, profile=null;
let loaded={jobs:false,cos:false,src:false};
let triggers=null, trigState="idle", trigErr="";
let reviews=[], model=null;
let ui={roleTab:"review",roleRegion:"all",roleSort:"best",coTab:"active",srcTab:"all",q:"",revDim:"region",revWeek:0};
try{Object.assign(ui,JSON.parse(localStorage.getItem("jr2-ui")||"{}"));ui.q="";}catch(e){}
const saveUi=()=>{try{localStorage.setItem("jr2-ui",JSON.stringify(ui))}catch(e){}};
let lastAppliedCount=null;

/* =================== helpers =================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lc=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const slug=s=>lc(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"item";
const safeUrl=u=>/^https?:\/\/[^\s]+$/i.test(u||"")?u:"";
const normUrl=u=>{u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return""}};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const fmtDay=s=>{const d=parseD(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"–"};
const label=(L,v)=>(L.find(x=>x[0]===v)||[v,v||"–"])[1];
const isWorkday=d=>!goals.weekdaysOnly||(d.getDay()>0&&d.getDay()<6);
const coById=id=>cos.find(c=>c.id===id);
const coName=j=>coById(j.companyId)?.name||j.company||"Unknown company";
function flagsOf(j){const f=j.flags;const arr=Array.isArray(f)?f.join(" "):String(f||"");return(arr.match(/\[[^\]]+\]/g)||[]).map(x=>x.slice(1,-1))}
function cvLabel(v){const s=lc(v);if(!s)return"";const hit=CVS.filter(([k,l])=>s===lc(k)||s===lc(l)||s.includes(lc(k)));return hit.length?hit.map(x=>x[1]).join(" or "):v}
function cvKey(v){const s=lc(v);if(!s)return"";const hit=CVS.find(([k,l])=>s===lc(k)||s===lc(l))||CVS.find(([k])=>s.includes(lc(k)));return hit?hit[0]:""}
function verdict(f){if(f==null||f==="")return"Not scored";if(f>=80)return"Apply now";if(f>=70)return"Tailor the CV";if(f>=60)return"Stretch";return"Weak match"}
const fitCls=f=>f==null||f===""?"lo":f>=80?"top":f>=70?"hi":f>=60?"mid":"lo";
function fitRing(f,size=64){const v=f==null||f===""?null:Math.max(0,Math.min(100,+f));const r=size/2-4,c=2*Math.PI*r;return`<div class="ring ${fitCls(f)}" style="width:${size}px;height:${size}px" role="img" aria-label="Fit ${v??"not scored"}${v!=null?" out of 100":""}, ${esc(verdict(f))}"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="5"/>${v!=null?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:""}</svg><span>${v??"–"}</span></div>`}
const ICON={
 ext:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 pin:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>',
 globe:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>',
 x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
 link:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
 spark:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10.5 13.9 12.4 12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/></svg>',
 clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 copy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 play:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>'
};

/* =================== location =================== */
function places(){return[settings.homeCity,...(settings.nearby||[])].filter(Boolean).map(lc)}
function homeOk(city){const c=lc(city);if(!c)return false;return places().some(p=>c.includes(p))}
function otherOk(city){const c=lc(city);return (settings.otherCities||[]).some(p=>p&&c.includes(lc(p)))}
function scopeOk(scope){const s=lc(scope),from=settings.remoteFrom||"Europe";if(!s||/timezone|gmt|cet|utc/.test(s)&&!/(us|america)/.test(s))return true;if(/worldwide|anywhere|global/.test(s))return true;if(from==="Country"){const c=lc(settings.country).slice(0,4);return (c&&s.includes(c))||/europe|emea|\beu\b|cet/.test(s)}if(from==="Europe")return/europe|emea|\beu\b|ital|cet|uk|germany|france|spain|netherlands|portugal/.test(s);return true}
function region(o){if(o.mode==="remote")return"remote";if(homeOk(o.city))return"home";return o.city?"europe":"unknown"}
function inArea(o){
  const m=settings.modes||[];
  if(o.mode==="remote")return m.includes("remote")&&scopeOk(o.scope);
  if(o.mode&&!m.includes(o.mode))return false;
  if(homeOk(o.city))return true;
  if(!o.city)return true;
  if(settings.relocate==="europe")return!NON_EU.test(lc(o.city));
  if(settings.relocate==="cities")return otherOk(o.city);
  return false;
}
function whereChip(o){
  const r=region(o),m=label(MODES,o.mode);
  if(r==="home")return`<span class="chip home">${ICON.pin}${esc(shortCity(o.city))}${o.mode?` · ${esc(m.toLowerCase())}`:""}</span>`;
  if(r==="remote")return`<span class="chip remote">${ICON.globe}Remote${o.scope?` · ${esc(trimScope(o.scope))}`:""}</span>`;
  if(r==="europe")return`<span class="chip">${ICON.pin}${esc(shortCity(o.city))}${o.mode?` · ${esc(m.toLowerCase())}`:""}</span>`;
  return`<span class="chip out">Place not known</span>`;
}
const shortCity=c=>String(c||"").split(/[,(]/)[0].trim()||"Unknown";
const trimScope=s=>{s=String(s||"");return s.length>22?s.slice(0,20)+"…":s};

/* =================== ranking & goal =================== */
function priority(j){
  let p=(j.fit==null||j.fit==="")?58:+j.fit;
  const r=region(j);
  if(r==="home")p+=10; else if(r==="remote")p+=3;
  if(j.firstSeen&&daysBetween(j.firstSeen,today())<=3)p+=3;
  if(j.deadline){const d=daysBetween(today(),j.deadline);if(d>=0&&d<=10)p+=6}
  const fl=flagsOf(j).join(" ");
  if(/unlisted|stale|legitimacy/.test(fl))p-=8;
  if(j.status==="later")p-=2;
  p+=learnedBoost(j).total;
  return p;
}
function inQueue(j){
  if(!REVIEW.includes(j.status||"new"))return false;
  if(j.status==="later"&&j.snoozeUntil&&j.snoozeUntil>today())return false;
  if(j.deadline&&daysBetween(today(),j.deadline)<0)return false;
  if(!inArea(j))return false;
  if(j.fit!=null&&j.fit!==""&&+j.fit<60)return false;
  return true;
}
const coKey=j=>j.companyId||slug(j.company||"");
/* keep a company's roles next to each other, ordered by the company's best role, so they can be sent together */
function groupByCompany(list){const out=[],seen=new Set();for(const j of list){if(seen.has(j.id))continue;out.push(j);seen.add(j.id);for(const x of list)if(!seen.has(x.id)&&coKey(x)===coKey(j)){out.push(x);seen.add(x.id)}}return out}
const queue=()=>groupByCompany(jobs.filter(inQueue).sort((a,b)=>priority(b)-priority(a)));
const siblings=j=>queue().filter(x=>x.id!==j.id&&coKey(x)===coKey(j));
function appliedByDay(){const m={};for(const j of jobs){if(j.appliedAt&&["applied","interview","offer","rejected","closed"].includes(j.status)){const d=String(j.appliedAt).slice(0,10);m[d]=(m[d]||0)+1}}return m}
function workdaysBack(n,from=new Date()){const out=[];const d=new Date(from);while(out.length<n){if(isWorkday(d))out.unshift(ymd(d));d.setDate(d.getDate()-1)}return out}
function goalStats(){
  const by=appliedByDay(),t=goals.dailyTarget||5,td=today();
  const todayN=by[td]||0;
  let streak=0;const d=new Date();
  if((by[td]||0)>=t)streak=1;
  d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){if(isWorkday(d)){if((by[ymd(d)]||0)>=t)streak++;else break}d.setDate(d.getDate()-1)}
  const days=Object.keys(by).sort();let best=0,run=0;
  if(days.length){const s=parseD(days[0]),e=new Date();for(const x=new Date(s);x<=e;x.setDate(x.getDate()+1)){if(!isWorkday(x))continue;if((by[ymd(x)]||0)>=t){run++;best=Math.max(best,run)}else if(ymd(x)!==td)run=0}}
  const wk=new Date();const dow=(wk.getDay()+6)%7;wk.setDate(wk.getDate()-dow);let week=0;for(let i=0;i<=dow;i++){const x=new Date(wk);x.setDate(wk.getDate()+i);week+=by[ymd(x)]||0}
  const weekTarget=t*(goals.weekdaysOnly?5:7);
  return{by,t,todayN,streak,best:Math.max(best,streak),week,weekTarget,isWorkdayToday:isWorkday(new Date())};
}

/* =================== learning =================== */
/* Same definitions as the rulebook's Learning section, so the page and the Sunday run agree. */
const APPLIED_ST=["applied","interview","offer","rejected","closed"];
const isApplied=j=>!!j.appliedAt&&APPLIED_ST.includes(j.status);
function outcome(j){if(["interview","offer"].includes(j.status))return"positive";if(j.status==="rejected")return"rejected";if(j.appliedAt&&daysBetween(j.appliedAt,today())>=21)return"noreply";return"pending"}
const fitBand=f=>f==null||f===""?"Not scored":f>=80?"80+":f>=70?"70–79":f>=60?"60–69":"Under 60";
function sourceLabel(j){const s=j.source||"";if(s==="pasted"||(!s&&j.addedBy==="you"))return"Added by you";if(s==="company")return"Company careers pages";if(s==="web")return"Open web search";if(s){const x=srcs.find(z=>z.id===s);return x?x.name:s}return"Not recorded"}
const DIMS=[
 ["region","Where",j=>({home:settings.homeCity||"Home",remote:"Remote",europe:"Elsewhere in Europe",unknown:"Place not known"})[region(j)]],
 ["cv","CV",j=>cvLabel(j.cv)||"Not set"],
 ["tier","Company type",j=>j.tier?`${j.tier} · ${label(TIERS,j.tier)}`:"Not set"],
 ["fit","Fit",j=>fitBand(j.fit)],
 ["mode","Work mode",j=>j.mode?label(MODES,j.mode):"Not known"],
 ["source","Source",j=>sourceLabel(j)]];
function learnModel(){
  const dec=jobs.filter(j=>isApplied(j)||j.status==="skipped");
  const apps=dec.filter(isApplied);
  const res=apps.filter(j=>outcome(j)!=="pending");
  const pos=res.filter(j=>outcome(j)==="positive");
  const chooseG=dec.length?apps.length/dec.length:.5, workG=res.length?pos.length/res.length:.15, M=4;
  const dims={};
  for(const [k,,fn] of DIMS){const b={};
    for(const j of dec){const key=fn(j);const x=b[key]||(b[key]={key,decided:0,applied:0,skipped:0,resolved:0,positive:0,rejected:0,noreply:0,pending:0});x.decided++;
      if(isApplied(j)){x.applied++;const o=outcome(j);if(o==="pending")x.pending++;else{x.resolved++;x[o]++}}else x.skipped++}
    for(const x of Object.values(b)){x.choose=(x.applied+M*chooseG)/(x.decided+M);x.work=(x.positive+M*workG)/(x.resolved+M);
      x.boost=x.decided>=3?Math.max(-6,Math.min(6,Math.round(15*(x.choose-chooseG)+40*(x.work-workG)))):0}
    dims[k]=b}
  return{chooseG,workG,decided:dec.length,applied:apps.length,resolved:res.length,positive:pos.length,dims};
}
function boostText(name,x,m){
  const moreReplies=x.resolved>=3&&x.work>m.workG+.04, fewerReplies=x.resolved>=3&&x.work<m.workG-.04;
  if(x.boost>0)return moreReplies?`${name} roles get you more replies`:`you apply to most ${name} roles`;
  return fewerReplies?`${name} roles have brought fewer replies so far`:`you usually skip ${name} roles`;
}
function learnedBoost(j){
  if(!model||goals.learn===false)return{total:0,top:null};
  let total=0,top=null;
  for(const [k,,fn] of DIMS){const x=model.dims[k]?.[fn(j)];if(!x||!x.boost)continue;total+=x.boost;if(!top||Math.abs(x.boost)>Math.abs(top.boost))top={boost:x.boost,text:boostText(fn(j),x,model)}}
  return{total:Math.max(-12,Math.min(12,total)),top};
}
function learnedList(){const out=[];if(!model)return out;for(const [k,lbl] of DIMS)for(const x of Object.values(model.dims[k]||{}))if(x.boost)out.push({dim:lbl,key:x.key,boost:x.boost,x,text:boostText(x.key,x,model)});return out.sort((a,b)=>Math.abs(b.boost)-Math.abs(a.boost))}

/* ---------- weeks ---------- */
function weekStart(off=0){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+7*off);return d}
function isoWeekId(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return`${y}-W${pad(w)}`}
function weekStats(off){
  const s=weekStart(off),e=new Date(s);e.setDate(s.getDate()+6);const from=ymd(s),to=ymd(e);const inW=d=>d&&d>=from&&d<=to;
  const by=appliedByDay(),t=goals.dailyTarget||5;let goalDays=0,workdays=0;
  for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);if(ymd(d)>today())break;if(!isWorkday(d))continue;workdays++;if((by[ymd(d)]||0)>=t)goalDays++}
  const applied=jobs.filter(j=>isApplied(j)&&inW(String(j.appliedAt).slice(0,10)));
  return{from,to,id:isoWeekId(s),applied,skipped:jobs.filter(j=>j.status==="skipped"&&inW(j.skippedAt)),
    replies:jobs.filter(j=>inW(j.repliedAt)),interviews:jobs.filter(j=>["interview","offer"].includes(j.status)&&inW(j.repliedAt)),

function withEdited(cur,ch){const s=new Set(cur.edited||[]);Object.keys(ch).forEach(k=>{if(!["snoozeUntil","kit","followedUpAt","repliedAt","skippedAt","appliedAt","cvScores","checkedAt"].includes(k))s.add(k)});return{...ch,edited:[...s]}}
const COLS={jobs:"jobs",cos:"companies",src:"sources"};
const listOf=k=>k==="jobs"?jobs:k==="cos"?cos:srcs;
async function patch(kind,id,ch,msg,undoFn){
  const cur=listOf(kind).find(o=>o.id===id);if(!cur)return false;
  const data=withEdited(cur,ch);Object.assign(cur,data);render();
  if(!db){toast("Not connected. Sign in to claude.ai and reload.");return false}
  try{await db.collection(COLS[kind]).doc(id).update(data);if(msg)toast(msg,undoFn?"Undo":null,undoFn);return true}
  catch(e){toast(`Couldn't save: ${e&&e.message||"the board didn't answer"}.`);return false}
}
async function setStatus(id,st,opts={}){
  const j=jobs.find(x=>x.id===id);if(!j)return;
  const prev={status:j.status||"new",appliedAt:j.appliedAt||"",snoozeUntil:j.snoozeUntil||""};
  const ch={status:st};
  if(st==="applied"&&!j.appliedAt)ch.appliedAt=today();
  if(REVIEW.includes(st)&&j.appliedAt&&j.appliedAt===today()&&prev.status==="applied")ch.appliedAt="";
  if(["interview","offer","rejected"].includes(st)&&j.appliedAt&&!j.repliedAt)ch.repliedAt=today();
  if(st==="skipped")ch.skippedAt=today();
  prev.repliedAt=j.repliedAt||"";prev.skippedAt=j.skippedAt||"";
  if(st==="later"){const d=new Date();do{d.setDate(d.getDate()+1)}while(!isWorkday(d));ch.snoozeUntil=ymd(d)}
  const msgs={applied:`Applied: ${j.role}.`,skipped:`Skipped ${j.role}.`,later:`Back in your queue on ${fmtDay(ch.snoozeUntil)}.`,interview:"Moved to interviewing. Good luck.",offer:"Offer! Moved to Offer.",rejected:"Marked rejected.",closed:"Marked closed.",new:"Back in your review queue."};
  await patch("jobs",id,ch,opts.quiet?null:(msgs[st]||"Saved."),()=>patch("jobs",id,prev,"Undone."));
}
async function removeItem(kind,id){
  const cur=listOf(kind).find(o=>o.id===id);if(!cur||!db)return;
  const {id:_,...data}=cur;const col=COLS[kind];
  const name=kind==="jobs"?`${cur.role} at ${coName(cur)}`:cur.name;
  try{await db.collection("deleted").doc(`${col}--${id}`).set({kind:col,id,name,deletedAt:today()});await db.collection(col).doc(id).delete();}

  toast(`Deleted ${name}.`,"Undo",async()=>{try{await db.collection(col).doc(id).set(data);await db.collection("deleted").doc(`${col}--${id}`).delete();toast(`Restored ${name}.`)}catch(e){toast("Couldn't restore it.")}});
}

const TASK_INFO={find_jobs:{name:"Find jobs",what:"Checks companies and job sites, adds new roles."},find_companies:{name:"Find companies",what:"Finds and verifies new companies, rebuilds your profile."},evening_nudge:{name:"Evening nudge",what:"Pings your phone if you haven't applied to anything yet."},weekly_review:{name:"Weekly review",what:"Sunday evening: updates what the radar learned and writes the week's notes."}};
function taskKind(t){const n=lc(t.name);if(n.includes("nudge")||n.includes("remind"))return"evening_nudge";if(n.includes("review"))return"weekly_review";if(n.includes("compan"))return"find_companies";return"find_jobs"}
function parseCron(c){const m=/^(?:CRON_TZ=(\S+)\s+)?(\S+)\s+(\S+)\s+\S+\s+\S+\s+(\S+)/.exec(c||"");if(!m)return null;return{tz:m[1]||"UTC",min:m[2],hour:m[3],dow:m[4]}}
function cronDays(d){if(d==="*")return"Every day";if(d==="1-5")return"Weekdays";if(d==="0"||d==="7")return"Sundays";const n=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];if(/^\d$/.test(d))return n[+d]+"s";return d}
function nightly(){const t=(triggers||[]).find(t=>taskKind(t)==="find_jobs");if(!t||!t.enabled||!t.next_run_at)return"";const d=new Date(t.next_run_at);return`at ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`}
function runsHtml(compact){
  const lr=lastRun?`<div class="run"><div class="hd"><span class="t">Last search</span><span class="s">${fmtDay(lastRun.date)}</span></div><span class="s">${lastRun.checked??0} companies checked · ${lastRun.newRoles??0} new roles${lastRun.newCompanies?` · ${lastRun.newCompanies} new companies`:""}</span></div>`:"";
  if(!triggers){
    if(trigState==="loading")return lr+`<p class="conn">Loading your scheduled runs…</p>`;
    return lr+`<div class="run"><span class="s">${trigState==="error"?esc(trigErr):"See when the next search runs, and start one now."}</span><div><button class="btn sm" data-act="loadtrig">${trigState==="error"?"Try again":"Show live status"}</button></div></div>`;
  }
  const list=triggers.filter(t=>!compact||["find_jobs","evening_nudge"].includes(taskKind(t)));
  return lr+list.map(t=>{const k=taskKind(t),info=TASK_INFO[k],c=parseCron(t.cron_expression);const next=t.enabled&&t.next_run_at?new Date(t.next_run_at):null;const st=t.last_run?.status||"";
    return`<div class="run" data-tid="${esc(t.id)}"><div class="hd"><span class="t"><span class="dot ${t.enabled?(/FAIL/.test(st)?"err":"on"):""}"></span>${esc(info.name)}</span>${k!=="evening_nudge"?`<button class="btn sm ghost" data-act="fire">${ICON.play} Run now</button>`:""}</div>
    <span class="s">${t.enabled?(next?`Next ${next.toLocaleDateString("en-GB",{weekday:"short"})} ${next.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`:"Scheduled"):"Paused"}${c?` · ${cronDays(c.dow)}`:""}${/FAIL/.test(st)?" · last run failed":""}</span></div>`}).join("");
}
function wireRuns(){const box=$("runsBox");if(!box)return;box.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.dataset.act==="loadtrig")loadTriggers(true);if(b.dataset.act==="fire")fire(b,b.closest("[data-tid]").dataset.tid)}}
function triggersHtml(){
  if(!triggers){return`<div class="trow"><div><div class="t">Scheduled runs</div><div class="s">${trigState==="loading"?"Loading…":trigState==="error"?esc(trigErr):"Turn runs on or off, change their time, or start one now. The first time, claude.ai asks you to allow this page."}</div></div><div class="c"><button class="btn sm" data-act="loadtrig">${trigState==="error"?"Try again":"Load"}</button></div></div>`}
  if(!triggers.length)return`<p class="preview">No Job Radar scheduled tasks found on your account.</p>`;
  const order={find_jobs:0,evening_nudge:1,weekly_review:2,find_companies:3};
  return [...triggers].sort((a,b)=>order[taskKind(a)]-order[taskKind(b)]).map(t=>{const k=taskKind(t),info=TASK_INFO[k],c=parseCron(t.cron_expression);const time=c&&/^\d+$/.test(c.hour)&&/^\d+$/.test(c.min)?`${pad(c.hour)}:${pad(c.min)}`:"";
    const lr=t.last_run?`Last run ${new Date(t.last_run.fired_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}${/FAIL/.test(t.last_run.status)?", failed":""}`:"Not run yet";
    return`<div class="trow" data-tid="${esc(t.id)}"><div style="min-width:0"><div class="t">${esc(info.name)}</div><div class="s">${esc(info.what)}</div><div class="s">${c?cronDays(c.dow):""}${c&&c.tz!=="UTC"?"":" (UTC)"} · ${esc(lr)}</div></div>
      <div class="c">${time?`<label class="sr" for="tm-${esc(t.id)}">Time</label><input type="time" id="tm-${esc(t.id)}" data-act="time" value="${time}">`:""}
      ${k!=="evening_nudge"?`<button class="btn sm ghost" data-act="fire">${ICON.play} Run now</button>`:""}
      <label class="check" title="${t.enabled?"On":"Off"}"><input type="checkbox" class="toggle" data-act="enable" ${t.enabled?"checked":""} aria-label="${esc(info.name)} on or off"></label></div></div>`}).join("");
}
function wireTriggers(){const box=$("trigBox");if(!box)return;
  box.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.dataset.act==="loadtrig")loadTriggers(true);if(b.dataset.act==="fire")fire(b,b.closest("[data-tid]").dataset.tid)};
  box.onchange=async e=>{const el=e.target;const row=el.closest("[data-tid]");if(!row)return;const t=triggers.find(x=>x.id===row.dataset.tid);if(!t)return;
    if(el.dataset.act==="enable")return updTrig(t,{enabled:el.checked},el.checked?`${TASK_INFO[taskKind(t)].name} is on.`:`${TASK_INFO[taskKind(t)].name} paused.`);
    if(el.dataset.act==="time"){const[h,m]=el.value.split(":");const c=parseCron(t.cron_expression);if(!c||!h)return;const cron=`CRON_TZ=${c.tz==="UTC"?(settings.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"):c.tz} ${+m} ${+h} * * ${c.dow}`;return updTrig(t,{cron_expression:cron},`${TASK_INFO[taskKind(t)].name} now runs at ${el.value}.`)}};
}
function mcpCopy(e,server){const c=e&&e.code;if(c==="server_not_connected")return`${server} isn't connected. Add it in claude.ai Settings, Connectors.`;if(c==="needs_reauth")return`Reconnect ${server} in claude.ai Settings, Connectors.`;if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return"This page isn't allowed to use it yet. Try again and choose Allow.";if(c==="server_unavailable")return`${server} didn't answer. Try again in a minute.`;if(c==="not_granted"||c==="capability_disabled")return"Live controls aren't available in this view.";return(e&&e.message)||"Something went wrong."}

async function fire(btn,tid){

    body=`<div class="sec"><div class="callout">This role is already on your board.</div><div><button class="btn primary" id="openDupe">Open it</button></div></div>`;
  } else {
    const d=s.draft;
    body=`<div class="sec">${d.fit!=null&&d.fit!==""?`<div class="preview-score"><span class="num">${esc(d.fit)}</span><div><div class="v">${esc(verdict(d.fit))}${d.cv?` · ${esc(cvLabel(d.cv))} CV`:""}</div><div class="muted" style="font-size:.86rem">${inArea(d)?"Fits your location settings":"Outside your location settings"}</div></div></div>`:""}
      ${d.hardFail?`<div class="callout bad">${esc(d.hardFail)}</div>`:""}
      ${s.err?`<div class="callout warn">${esc(s.err)}</div>`:""}</div>
      <div class="sec"><div class="sec-h"><h3>Check and edit</h3></div><div class="fields" id="draftF">${[
      ["role","Role title","text",null,true],["company","Company","text"],["companySite","Company website","url"],["url","Posting link","url",null,true],
      ["mode","Work mode","select",{list:MODES,blank:"Not known"}],["city","City"],["scope","Remote open to"],["contract","Contract","select",{list:[["permanent","Permanent"],["fixed-term","Fixed-term"],["freelance","Freelance"]],blank:"Not stated"}],
      ["fit","Fit (0–100)","number"],["cv","Best CV","select",{list:CVS,blank:"Not set"}],["salary","Salary"],["deadline","Deadline","date"],
      ["flags","Flags","text",null,true],["note","Notes","textarea",null,true]].map(f=>fieldHtml(f,d)).join("")}</div></div>`;
  }
  const foot=s.step==="preview"?`<button class="btn ghost" id="addBack">Start over</button><span class="sp"></span><button class="btn" id="saveApplied">Save as applied</button><button class="btn primary" id="saveNew">Save role</button>`
    :`<span class="sp"></span>${s.step==="fetch"||s.step==="score"?`<button class="btn" id="addStop">Stop</button>`:`<button class="btn" data-close>Cancel</button>`}`;
  openSidePanel(`<div class="side-h"><div class="grow"><h2 id="sideTitle">Add a role</h2></div><button class="iconbtn" data-close aria-label="Close">${ICON.x}</button></div><div class="side-b">${body}</div><div class="side-f">${foot}</div>`,"add",null);
  const go=$("addGo");if(go)go.onclick=()=>{const v=$("addIn").value.trim();if(!v)return toast("Paste a link or the posting text.");if(s.step==="paste"){s.text=v;scoreText()}else{s.input=v;startAdd()}};
  const man=$("addManual");if(man)man.onclick=()=>{s.draft={role:"",company:"",url:/^https?:/.test(s.input)?s.input:"",mode:"",city:"",fit:null};s.step="preview";s.err="";drawAdd()};
  const stop=$("addStop");if(stop)stop.onclick=()=>{if(addCtl)addCtl.abort();s.step="paste";s.err="Stopped.";drawAdd()};
  const back=$("addBack");if(back)back.onclick=()=>{addState={input:"",step:"input",draft:null,err:""};drawAdd()};
  const od=$("openDupe");if(od)od.onclick=()=>openRole(s.dupeId);
  if(s.step==="preview"){$("draftF").addEventListener("input",e=>{const el=e.target.closest("[data-k]");if(el)s.draft[el.dataset.k]=el.value});$("saveNew").onclick=()=>saveDraft("new");$("saveApplied").onclick=()=>saveDraft("applied")}
  const ta=$("addIn");if(ta)ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))go.click()});
}
function extractText(res){
  const p=res&&res.payload;
  const pick=o=>{if(!o)return"";if(typeof o==="string")return o;if(Array.isArray(o))return o.map(pick).sort((a,b)=>b.length-a.length)[0]||"";if(typeof o==="object"){for(const k of["raw_content","content","markdown","text"])if(typeof o[k]==="string"&&o[k].length>80)return o[k];if(o.results)return pick(o.results);}return""};
  let t=pick(p);
  if(!t&&res&&Array.isArray(res.content))t=res.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return t||"";
}
async function startAdd(){
  const s=addState;const v=s.input.trim();
  const isUrl=/^https?:\/\/\S+$/.test(v)||/^[\w.-]+\.[a-z]{2,}\/\S*$/i.test(v);
  if(!isUrl){s.text=v;return scoreText()}
  const url=normUrl(v);s.input=url;
  const dupe=jobs.find(j=>j.url&&(j.url===url||j.url.replace(/[?#].*$/,"")===url.replace(/[?#].*$/,"")));
  if(dupe){s.step="dupe";s.dupeId=dupe.id;return drawAdd()}
  if(!sample){s.step="paste";s.err="Automatic reading works when the page is open on claude.ai. Fill it in by hand instead.";return drawAdd()}
  s.step="fetch";drawAdd();
  if(!mcp){s.step="paste";s.err="This view can't open web pages.";return drawAdd()}
  addCtl=new AbortController();const ctl=addCtl;
  try{
    const res=await mcp.callTool("Tavily","tavily_extract",{urls:[url],extract_depth:/linkedin|indeed|glassdoor|infojobs/.test(url)?"advanced":"basic",format:"text"},{signal:ctl.signal,cache:false});
    const text=extractText(res);
    if(!text||text.length<200){s.step="paste";s.err="That page didn't give back a readable job description (it may need a login or load with JavaScript).";return drawAdd()}
    s.text=text;scoreText();
  }catch(e){
    if(e.code==="cancelled")return;
    s.step="paste";s.err=e.code==="tool_error"?"That page couldn't be read.":mcpCopy(e,"Tavily");drawAdd();
  }
}
async function scoreText(){
  const s=addState;s.step="score";drawAdd();
  if(!sample){s.step="paste";s.err="Scoring works when the page is open on claude.ai.";return drawAdd()}
  addCtl=new AbortController();const ctl=addCtl;
  const set=settings;
  const prompt=`Extract one job posting into JSON and score it for this candidate. Reply with only one JSON object.

CANDIDATE PROFILE (only facts here count):
${profileText()}

LOCATION SETTINGS: home ${set.homeCity}${(set.nearby||[]).length?` (also ${set.nearby.join(", ")})`:""}; accepts ${(set.modes||[]).join(", ")}; remote roles must be open to ${set.remoteFrom}; on-site/hybrid outside home: ${set.relocate==="europe"?"anywhere in Europe":set.relocate==="cities"?(set.otherCities||[]).join(", "):"no"}.

SCORING RULES (0-100): tag each requirement core (main stack or marked required/obbligatorio), listed, nice, inferred. Must-haves 55 (core counts double), role and level 25, nice-to-haves and domain 10, signals 10 (named employer, stated salary, freshness, apply route). Caps, lowest wins: a missing core requirement caps at 55; two or more missing listed caps at 65; years required in a technology the profile shows only in projects caps at 70; a degree required with no "or equivalent" wording and not held caps at 70 (with equivalence wording it's only the flag [degree or equivalent]); unclear if still open caps at 60; US hours caps at 65; intermediary caps at 75. Years count only from DATED YEARS. Hard fails (set hardFail to a short reason): ${settings.maxYears?`more than ${settings.maxYears} years required, `:""}internship/stage/trainee, required language not held, public call requiring a degree the candidate doesn't hold, location outside the settings.

POSTING TEXT (from ${/^https?:/.test(s.input)?s.input:"pasted text"}):
"""
${String(s.text).slice(0,24000)}
"""

JSON shape:
{"role": string, "company": string, "companySite": "https://... or empty", "city": string or "", "mode": "on-site"|"hybrid"|"remote"|"", "scope": "who can apply if remote, e.g. ${settings.country||"a country"}, Europe, Worldwide, or empty", "contract": "permanent"|"fixed-term"|"freelance"|"", "salary": "as stated or empty", "posted": "YYYY-MM-DD or empty", "deadline": "YYYY-MM-DD or empty", "url": "the apply or posting link if the text shows one, else empty", "language": "it"|"en"|..., "fit": integer, "cv": ${cvEnum()}, "flags": "space-separated tags like [junior] [degree required] [agency] [board only: site]", "hardFail": "reason or empty", "note": "2-4 sentences for the candidate: what they want, which facts match, the main gaps, how to apply. Paraphrase; no quotes from the posting."}`;
  try{
    const d=await sample.json(prompt,{signal:ctl.signal,modelTier:"default"});
    if(!d||typeof d!=="object"||!d.role)throw{code:"invalid_json"};
    const url=/^https?:/.test(s.input)?s.input:(safeUrl(d.url)||"");
    s.draft={role:String(d.role||""),company:String(d.company||""),companySite:safeUrl(d.companySite)||"",url,city:String(d.city||""),mode:["on-site","hybrid","remote"].includes(d.mode)?d.mode:"",scope:String(d.scope||""),contract:["permanent","fixed-term","freelance"].includes(d.contract)?d.contract:"",salary:String(d.salary||""),posted:/^\d{4}-\d{2}-\d{2}$/.test(d.posted||"")?d.posted:"",deadline:/^\d{4}-\d{2}-\d{2}$/.test(d.deadline||"")?d.deadline:"",fit:Number.isFinite(+d.fit)?Math.max(0,Math.min(100,Math.round(+d.fit))):null,cv:cvKey(d.cv),flags:String(d.flags||""),note:String(d.note||""),hardFail:String(d.hardFail||"")};
    s.step="preview";s.err="";drawAdd();
  }catch(e){
    if(e.code==="cancelled")return;
    const msg={not_granted:"You chose not to let this page use Claude. Fill it in by hand instead.",rate_limited:"Claude is busy or you've hit a usage limit. Try again in a bit, or fill it in by hand.",invalid_json:"Claude's answer couldn't be read. Try again.",prompt_too_large:"That text is too long. Paste only the job description."}[e.code]||"Scoring didn't finish. Try again, or fill it in by hand.";
    s.step="paste";s.err=msg;drawAdd();
  }
}
async function saveDraft(status){
  const d=addState.draft;if(!db)return toast("Not connected.");
  if(!d.role.trim())return toast("Enter the role title.");if(!d.company.trim())return toast("Enter the company.");
  const cid=slug(d.company);const existing=coById(cid)||cos.find(c=>lc(c.name)===lc(d.company));
  const companyId=existing?existing.id:cid;
  let nid=slug(d.company+" "+d.role),k=2;while(jobs.some(x=>x.id===nid))nid=slug(d.company+" "+d.role)+"-"+(k++);
  const fit=d.fit===""||d.fit==null?null:Math.max(0,Math.min(100,Math.round(+d.fit)));
  const doc={role:d.role.trim(),company:d.company.trim(),companyId,tier:existing?.tier||"",url:normUrl(d.url),city:d.city||"",mode:d.mode||"",scope:d.scope||"",modeNote:"",contract:d.contract||"",posted:d.posted||"",deadline:d.deadline||"",firstSeen:today(),cv:d.cv||"",fit,flags:d.flags||"",note:d.note||"",salary:d.salary||"",status,appliedAt:status==="applied"?today():"",source:"pasted",edited:["role","company","url","fit","note","status"],addedBy:"you"};
  try{
    if(!existing){await db.collection("companies").doc(cid).set({name:d.company.trim(),tier:"",status:status==="applied"?"applied":"watch",site:safeUrl(d.companySite)||"",careers:"",city:d.city||"",mode:d.mode||"",scope:d.scope||"",modeNote:"",what:"",roles:d.role.trim(),email:"",contact:"",notes:"Added from a role you pasted.",ats:"",verified:false,lastChecked:"",openRoles:1,edited:["name"],addedBy:"you"});try{await db.collection("deleted").doc("companies--"+cid).delete()}catch(x){}}
    await db.collection("jobs").doc(nid).set(doc);try{await db.collection("deleted").doc("jobs--"+nid).delete()}catch(x){}
    closeSide(true);toast(status==="applied"?`Saved and counted: ${doc.role}.`:`Added ${doc.role}.`,"Open",()=>openRole(nid));
  }catch(e){toast(`Couldn't save: ${e&&e.message||"try again"}.`)}
}

/* =================== keyboard =================== */
document.addEventListener("keydown",e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||"";const typing=/INPUT|TEXTAREA|SELECT/.test(tag);
  if(e.key==="Escape"&&$("sideRoot").innerHTML){closeSide();return}
  if(e.key==="Tab"&&$("sideRoot").innerHTML){const f=[...$("sideRoot").querySelectorAll('.side a[href],.side button:not([disabled]),.side input,.side select,.side textarea')].filter(x=>x.offsetParent!==null);if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if($("sideRoot").innerHTML)return;
  if(e.key==="/"){const q=$("q")||$("paste");if(q){e.preventDefault();q.focus()}return}
  if(e.key==="n"){e.preventDefault();openAdd("");return}
  if(view()==="today"){const card=document.querySelector(".focus[data-id]");if(!card)return;const id=card.dataset.id;
    if(e.key==="a")advance(card,id,"applied");if(e.key==="s")advance(card,id,"skipped");if(e.key==="l")advance(card,id,"later");
    if(e.key==="o"){const a=card.querySelector('[data-act="open"]');if(a)a.click()}if(e.key==="k")openRole(id,{kit:true})}
});
$("addTop").onclick=()=>openAdd("");

document.documentElement.lang="en";
render();
(async()=>{

  db.collection("companies").limit(1000).onSnapshot(sn=>{cos=sn.docs.map(x=>({id:x.id,...x.data()}));loaded.cos=true;render()},()=>toast("Couldn't load companies."));
  db.collection("sources").limit(1000).onSnapshot(sn=>{srcs=sn.docs.map(x=>({id:x.id,...x.data()}));loaded.src=true;render()},()=>{});
  db.doc("meta/lastRun").onSnapshot(sn=>{lastRun=sn.exists?sn.data():null;render()});
  db.doc("meta/settings").onSnapshot(sn=>{const v=sn.exists?sn.data():{};settings={...DEF_SET,...v};setCvs(settings.cvs);if(!v.relocate)settings.relocate=(v.otherCities||[]).length?"cities":"home";render()});
  db.doc("meta/goals").onSnapshot(sn=>{goals={...DEF_GOAL,...(sn.exists?sn.data():{})};render()});
  db.collection("reviews").limit(200).onSnapshot(sn=>{reviews=sn.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(b.id).localeCompare(a.id));if(view()==="review")render()},()=>{});
  db.doc("meta/profile").onSnapshot(sn=>{profile=sn.exists?sn.data():null});
  if(mcp&&perms){try{const st=await perms.state("mcp:"+RC);if(st==="granted")loadTriggers()}catch(e){}}
})();
